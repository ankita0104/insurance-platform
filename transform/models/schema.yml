version: 2

models:
  - name: stg_claims
    description: "Cleaned claims with a derived severity band."
    columns:
      - name: claim_id
        data_tests:
          - not_null
          - unique
      - name: status
        data_tests:
          - accepted_values:
              values: ['approved', 'pending', 'denied']
      - name: severity_band
        data_tests:
          - accepted_values:
              values: ['small', 'medium', 'large', 'catastrophic']

  - name: stg_policies
    description: "Cleaned policies with a derived premium tier."
    columns:
      - name: policy_id
        data_tests:
          - not_null
          - unique
      - name: premium_tier
        data_tests:
          - accepted_values:
              values: ['budget', 'standard', 'premium']
             